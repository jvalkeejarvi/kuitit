name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - run: bun run test:run

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      # Same publish the release image is built from; it must carry the SPA.
      - run: dotnet publish src/Kuitit.Api -c Release -o publish
      - name: Published app includes the SPA
        run: test -f publish/wwwroot/index.html && ls publish/wwwroot/assets | grep -q '\.js$'
      # The committed TS client must match the API's OpenAPI document, which only Development serves.
      - name: Generated API client is up to date
        env:
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5099
          DATA_DIR: ${{ runner.temp }}/kuitit
          Auth__Authority: https://idp.invalid
          Auth__ClientId: ci
          Auth__ClientSecret: ci
          Auth__AllowedUsers__0: "*"
        run: |
          (cd publish && dotnet Kuitit.Api.dll) &
          timeout 30 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:5099/healthz; do sleep 0.5; done'
          (cd web && bun run client)
          git diff --exit-code -- web/src/api/client

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: OpenAPI document is up to date
        run: git diff --exit-code -- web/openapi.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - name: Generated API client is up to date
        run: bun run client && git diff --exit-code -- src/api/client
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - run: bun run test:run

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      # Same publish the release image is built from; it must carry the SPA.
      - run: dotnet publish src/Kuitit.Api -c Release -o publish
      - name: Published app includes the SPA
        run: test -f publish/wwwroot/index.html && ls publish/wwwroot/assets | grep -q '\.js$'

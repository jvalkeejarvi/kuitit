name: Release

# Push a tag like v0.1.0 to publish ghcr.io/<owner>/kuitit:0.1.0 (+ :latest).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kuitit
  # Synology x86 models. Add linux/arm64 for ARM NAS models (doubles GHCR storage per version).
  PLATFORMS: linux/amd64
  # GHCR free tier has 500 MB for private packages.
  KEEP_VERSIONS: 3

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: contains(env.PLATFORMS, ',')
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # One package version per release, so retention below counts releases, not attestation manifests.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: kuitit
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_VERSIONS }}

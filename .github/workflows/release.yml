name: Release

# Push a tag like v0.1.0 to publish ghcr.io/<owner>/kuitit:0.1.0 (+ :latest) for linux/amd64 and linux/arm64.
# The image is built by the .NET SDK (container settings live in src/Kuitit.Api/Kuitit.Api.csproj).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # GitHub release with the compose files
  packages: write

env:
  IMAGE_REPOSITORY: ${{ github.repository_owner }}/kuitit
  # Each release is 3 package versions (index + amd64 + arm64), so this keeps the last 3 releases.
  # The package is public (see README), so storage is free; retention just keeps the version list short.
  KEEP_VERSIONS: 9

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      # The SDK pushes with the credentials docker login stores.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Kuitit.Api -c Release -t:PublishContainer \
            -p:Version="$version" \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository="${IMAGE_REPOSITORY,,}" \
            -p:ContainerImageTags="\"$version;latest\""

      # Install files for the NAS, with the image defaulting to this release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          sed "s/\${KUITIT_VERSION:-latest}/\${KUITIT_VERSION:-$version}/" compose.yaml > release/compose.yaml
          grep -q "kuitit:\${KUITIT_VERSION:-$version}" release/compose.yaml
          cp .env.example release/env.example
          gh release create "$GITHUB_REF_NAME" release/compose.yaml release/env.example --generate-notes --verify-tag

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: kuitit
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_VERSIONS }}
